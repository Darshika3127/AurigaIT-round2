<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharmacy Inventory</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
    section { border: 1px solid #ddd; margin: 1rem 0; padding: 1rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    input, button { padding: .5rem; }
    button { cursor: pointer; }
    pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Pharmacy Inventory</h1>

  <section>
    <h2>Add batch</h2>
    <form data-endpoint="/batches" data-method="POST">
      <input name="batch_id" placeholder="Batch ID" required>
      <input name="medicine_name" placeholder="Medicine name" required>
      <input name="expiry_date" type="date" required>
      <input name="quantity" type="number" min="1" placeholder="Quantity" required>
      <button type="submit">Add batch</button>
    </form>
  </section>

  <section>
    <h2>Dispense</h2>
    <form data-endpoint="/dispense" data-method="POST">
      <input name="medicine_name" placeholder="Medicine name" required>
      <input name="quantity" type="number" min="1" placeholder="Quantity" required>
      <button type="submit">Dispense</button>
    </form>
  </section>

  <section>
    <h2>Lookups</h2>
    <form data-action="batches"><button type="submit">View all batches</button></form>
    <form data-action="stock">
      <input name="name" placeholder="Medicine name" required>
      <button type="submit">Check stock</button>
    </form>
    <form data-action="search">
      <input name="name" placeholder="Medicine name" required>
      <button type="submit">Search</button>
    </form>
    <form data-action="alerts">
      <input name="days" type="number" min="0" value="7" required>
      <button type="submit">View expiry alerts</button>
    </form>
  </section>

  <h2>Result</h2>
  <pre id="result">Use a form above to make a request.</pre>
  <script>
    const result = document.getElementById('result');

    async function showResponse(response) {
      const data = await response.json();
      result.textContent = JSON.stringify(data, null, 2);
    }

    document.querySelectorAll('form[data-endpoint]').forEach((form) => {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const body = Object.fromEntries(new FormData(form));
        if (body.quantity) body.quantity = Number(body.quantity);
        await showResponse(await fetch(form.dataset.endpoint, {
          method: form.dataset.method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }));
      });
    });

    document.querySelectorAll('form[data-action]').forEach((form) => {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(form));
        let url = '/batches';
        if (form.dataset.action === 'stock') url = `/stock/${encodeURIComponent(values.name)}`;
        if (form.dataset.action === 'search') url = `/search?name=${encodeURIComponent(values.name)}`;
        if (form.dataset.action === 'alerts') url = `/alerts?days=${encodeURIComponent(values.days)}`;
        await showResponse(await fetch(url));
      });
    });
  </script>
</body>
</html>
